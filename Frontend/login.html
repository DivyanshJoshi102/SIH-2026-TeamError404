<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in </title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <header class="header">
    <a class="logo" href="index.html"><img src="sih-logo.png" alt="SIH logo" /><span class="logo-name">SMART INDIA<br />HACKATHON<br />2026</span></a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Log in</h1>
      <p class="auth-subtitle">Continue your Green adventure.</p>

      <form class="auth-form" id="loginForm">
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" placeholder="Enter Your Email id..." required />

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Enter your password" required />

        <button class="primary-button" type="submit">Log in</button> 
        <p class="auth-message" id="loginMessage" aria-live="polite"></p>

      </form>

      <p class="auth-switch">New Users... <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
