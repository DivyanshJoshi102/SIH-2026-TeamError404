<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
</head>
<body>
  <main>
    <section>
      <h2>Sign Up</h2>

      <form action="#" method="post">
        <div>
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
        </div>

        <br>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <br>

        <div>
          <label for="school">School Name</label>
          <input type="text" id="school" name="school" placeholder="Enter your school name" required>
        </div>

        <br>

        <div>
          <label for="class">Class</label>
          <select id="class" name="class" required>
            <option value="">Select your class</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
            <option value="13">Graduate</option>
            <option value="14">Post Graduate</option>
          </select>
        </div>

        <br>

        <div>
          <label for="role">Account Type</label>
          <select id="role" name="role" required>
            <option value="">Select account type</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="parent">Parent</option>
          </select>
        </div>

        <br>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" minlength="6" required>
        </div>

        <br>

        <div>
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" minlength="6" required>
        </div>

        <br>

        <div>
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the terms and conditions</label>
        </div>

        <br>

        <button type="submit">Create Account</button>
      </form>

      <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>
</body>
</html>
